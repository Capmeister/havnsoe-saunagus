name: Undersoeg billetstatus

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Installer Playwright
        run: |
          python -m pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Find billetstatus i HTML
        run: |
          python - <<'PY'
          import re
          import time
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          URL = "https://havnsoe.com/arrangementer/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 390, "height": 844},
                  locale="da-DK"
              )

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              page.wait_for_function(
                  "() => typeof window.jQuery === 'function'",
                  timeout=30000
              )
              page.wait_for_timeout(10000)

              def count():
                  return page.locator(
                      ".mec-event-article"
                  ).count()

              for attempt in range(100):
                  button = page.locator(
                      ".mec-load-more-button"
                  ).first

                  if button.count() == 0 or not button.is_visible():
                      break

                  before = count()
                  button.click(timeout=15000)
                  deadline = time.monotonic() + 25

                  while time.monotonic() < deadline:
                      if count() > before:
                          break
                      if not button.is_visible():
                          break
                      page.wait_for_timeout(500)

                  if count() == before and button.is_visible():
                      raise RuntimeError(
                          "Kunne ikke hente hele listen."
                      )
              else:
                  raise RuntimeError(
                      "For mange Se flere-klik."
                  )

              soup = BeautifulSoup(
                  page.content(),
                  "html.parser"
              )

              events = soup.select(".mec-event-article")
              print("ANTAL ARRANGEMENTER:", len(events))

              for number, event in enumerate(events, 1):
                  heading = event.select_one(
                      ".mec-event-title, h4"
                  )
                  title = (
                      heading.get_text(" ", strip=True)
                      if heading else "(uden titel)"
                  )

                  print(
                      "\n=== ARRANGEMENT", number, "===",
                      flush=True
                  )
                  print("TITEL:", title, flush=True)

                  print("LINKS OG KNAPPER:", flush=True)
                  for element in event.select(
                      "a, button, [role=button], "
                      "[class*=ticket], [class*=sold], "
                      "[class*=billet], [class*=status]"
                  ):
                      text = element.get_text(
                          " ", strip=True
                      )
                      if not text:
                          continue

                      print(
                          "TAG:", element.name,
                          "| CLASS:",
                          " ".join(element.get("class", [])),
                          "| TEKST:", text[:200],
                          flush=True
                      )

                  print(
                      "HELE ARRANGEMENTETS TEKST:",
                      event.get_text(" ", strip=True)[:700],
                      flush=True
                  )

              print("\nDIAGNOSE FAERDIG")
              browser.close()
          PY
