name: Undersoeg Havnsø arrangementer

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Installer Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Undersoeg MEC JavaScript
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://havnsoe.com/arrangementer/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 390, "height": 844},
                  locale="da-DK"
              )

              def log_request(request):
                  if request.resource_type in ("xhr", "fetch"):
                      print("XHR REQUEST:", request.method,
                            request.url[:200], flush=True)
                      if request.method == "POST":
                          data = request.post_data or ""
                          print("POST ACTION:",
                                data[:300].split("&")[0], flush=True)

              def log_response(response):
                  if response.request.resource_type in ("xhr", "fetch"):
                      print("XHR RESPONSE:", response.status,
                            response.url[:200], flush=True)

              page.on("request", log_request)
              page.on("response", log_response)
              page.on("pageerror", lambda e:
                      print("JS ERROR:", str(e)[:500], flush=True))
              page.on("console", lambda m:
                      print("CONSOLE ERROR:", m.text[:400], flush=True)
                      if m.type == "error" else None)

              print("AABNER SIDEN", flush=True)
              page.goto(URL, wait_until="domcontentloaded",
                        timeout=60000)
              page.locator(".mec-event-article").first.wait_for(
                  timeout=30000)
              page.wait_for_timeout(10000)

              def status():
                  return page.evaluate("""() => ({
                    events: document.querySelectorAll(
                      '.mec-event-article').length,
                    buttons: document.querySelectorAll(
                      '.mec-load-more-button').length,
                    jquery: typeof window.jQuery,
                    mec: typeof window.mecdata,
                    scripts: Array.from(document.scripts)
                      .map(s => s.src)
                      .filter(s => /mec|calendar/i.test(s))
                      .slice(0, 12),
                    button: (() => {
                      const b = document.querySelector(
                        '.mec-load-more-button');
                      if (!b) return null;
                      return {
                        visible: !!b.getClientRects().length,
                        classes: b.className,
                        parent: b.parentElement?.outerHTML.slice(0, 900),
                        jqueryEvents: window.jQuery
                          ? Object.keys(
                              window.jQuery._data(b, 'events') || {})
                          : []
                      };
                    })()
                  })""")

              import json
              print("STATUS FOER:", json.dumps(
                  status(), ensure_ascii=False), flush=True)

              print("TRYKKER SE FLERE", flush=True)
              page.locator(".mec-load-more-button").first.click(
                  timeout=15000)
              page.wait_for_timeout(12000)

              print("STATUS EFTER:", json.dumps(
                  status(), ensure_ascii=False), flush=True)

              print("DIAGNOSE FAERDIG", flush=True)
              browser.close()
          PY
