name: Undersoeg alle Havnsø arrangementer

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Installer Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Hent alle arrangementer
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import time

          URL = "https://havnsoe.com/arrangementer/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 390, "height": 844},
                  locale="da-DK"
              )

              page.on(
                  "pageerror",
                  lambda e: print(
                      "JS FEJL:", str(e)[:300], flush=True
                  )
              )

              print("AABNER HAVNSOE", flush=True)
              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              # Vent paa at sidens JavaScript er klar.
              page.wait_for_function(
                  "() => typeof window.jQuery === 'function'",
                  timeout=30000
              )
              page.wait_for_timeout(10000)

              def count():
                  return page.locator(
                      ".mec-event-article"
                  ).count()

              print("START ANTAL:", count(), flush=True)

              # Dette er kun en sikkerhedsgrænse mod
              # uendelige loops, ikke et antal arrangementer.
              for attempt in range(1, 101):
                  button = page.locator(
                      ".mec-load-more-button"
                  ).first

                  if button.count() == 0 or not button.is_visible():
                      print(
                          "FAERDIG: Ingen synlig Se flere-knap.",
                          flush=True
                      )
                      break

                  before = count()
                  print(
                      "KLIK", attempt,
                      "- antal foer:", before,
                      flush=True
                  )

                  responses = []

                  def record(response):
                      request = response.request
                      if (
                          "admin-ajax.php" in response.url
                          and "mec_grid_load_more"
                          in (request.post_data or "")
                      ):
                          responses.append(response)

                  page.on("response", record)

                  try:
                      button.click(timeout=15000)
                      deadline = time.monotonic() + 25

                      while time.monotonic() < deadline:
                          if count() > before:
                              break
                          if (
                              button.count() == 0
                              or not button.is_visible()
                          ):
                              break
                          page.wait_for_timeout(500)

                      page.wait_for_timeout(1000)

                  finally:
                      page.remove_listener("response", record)

                  after = count()

                  print(
                      "ANTAL EFTER:", after,
                      flush=True
                  )
                  print(
                      "MEC SVAR:",
                      [r.status for r in responses],
                      flush=True
                  )

                  if after > before:
                      continue

                  if (
                      button.count() == 0
                      or not button.is_visible()
                  ):
                      print(
                          "FAERDIG: Knappen er forsvundet.",
                          flush=True
                      )
                      break

                  print(
                      "STOP: Ingen nye arrangementer. "
                      "Kontrollerer om serveren meldte slut.",
                      flush=True
                  )

                  for response in responses:
                      try:
                          body = response.text()
                          print(
                              "SVAR LAENGDE:", len(body),
                              flush=True
                          )
                          print(
                              "SVAR UDDRAG:",
                              body[:500],
                              flush=True
                          )
                      except Exception as e:
                          print("SVAR FEJL:", str(e), flush=True)

                  print(
                      "USIKKER AFSLUTNING: "
                      "Knappen er stadig synlig.",
                      flush=True
                  )
                  break
              else:
                  raise RuntimeError(
                      "Sikkerhedsgraense naaet."
                  )

              print("\n=== ALLE FUNDE ARRANGEMENTER ===")
              for i, event in enumerate(
                  page.locator(".mec-event-article").all(), 1
              ):
                  title = event.locator(
                      ".mec-event-title"
                  ).first

                  print(
                      i, "|",
                      title.inner_text().strip()
                      if title.count() else "(uden titel)",
                      flush=True
                  )

              print(
                  "\nTOTAL ANTAL:",
                  count(),
                  flush=True
              )

              browser.close()
          PY
