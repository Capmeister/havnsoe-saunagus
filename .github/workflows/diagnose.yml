name: Undersoeg Havnsø arrangementer

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Installer Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Undersoeg netvaerk og Se flere
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          URL = "https://havnsoe.com/arrangementer/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 390, "height": 844},
                  locale="da-DK"
              )

              def interesting(url):
                  u = url.lower()
                  return (
                      "admin-ajax.php" in u
                      or "wp-json" in u
                      or "mec" in u
                  )

              def on_request(request):
                  if interesting(request.url):
                      print(
                          "REQUEST:",
                          request.method,
                          request.url[:250],
                          flush=True
                      )
                      if request.method == "POST":
                          print(
                              "POST DATA:",
                              str(request.post_data)[:1500],
                              flush=True
                          )

              def on_response(response):
                  if interesting(response.url):
                      print(
                          "RESPONSE:",
                          response.status,
                          response.url[:250],
                          flush=True
                      )
                      if "admin-ajax.php" in response.url:
                          try:
                              print(
                                  "RESPONSE BODY:",
                                  response.text()[:2000],
                                  flush=True
                              )
                          except Exception as e:
                              print("BODY ERROR:", str(e), flush=True)

              page.on("request", on_request)
              page.on("response", on_response)
              page.on(
                  "requestfailed",
                  lambda r: print(
                      "REQUEST FAILED:",
                      r.url[:250],
                      r.failure,
                      flush=True
                  )
              )
              page.on(
                  "pageerror",
                  lambda e: print("JAVASCRIPT ERROR:", str(e)[:500], flush=True)
              )
              page.on(
                  "console",
                  lambda m: print(
                      "BROWSER CONSOLE:",
                      m.type,
                      m.text[:300],
                      flush=True
                  ) if m.type == "error" else None
              )

              print("Aabner Havnsø...", flush=True)
              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )
              page.locator(
                  ".mec-event-article"
              ).first.wait_for(timeout=30000)

              count = lambda: page.locator(
                  ".mec-event-article"
              ).count()

              print("ANTAL FOER:", count(), flush=True)

              button = page.locator(
                  ".mec-load-more-button"
              ).first

              print("KNAP FUNDET:", button.count(), flush=True)
              print("KNAP SYNLIG:", button.is_visible(), flush=True)

              print("TRYKKER SE FLERE...", flush=True)
              button.click(timeout=15000)

              page.wait_for_timeout(20000)

              print("ANTAL EFTER:", count(), flush=True)
              print(
                  "KNAP HTML:",
                  button.evaluate("(el) => el.outerHTML")[:1500],
                  flush=True
              )

              print("DIAGNOSE FAERDIG", flush=True)
              browser.close()
          PY
