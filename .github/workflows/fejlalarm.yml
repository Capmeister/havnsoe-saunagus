name: Fejlalarm for saunagus

on:
  workflow_run:
    workflows:
      - Havnsø Saunagus overvågning
    types:
      - completed

jobs:
  alarm:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send fejlalarm til iPhone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          curl --fail-with-body \
            -H "Title: Saunagus-overvaagning fejlede" \
            -H "Priority: high" \
            -H "Click: $RUN_URL" \
            -d "GitHub kunne ikke gennemfoere kontrollen af saunagus. Tryk her for at se fejlen." \
            "https://ntfy.sh/$NTFY_TOPIC"
